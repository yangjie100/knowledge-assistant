<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-white shadow px-6 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-800">Knowledge Base Admin</h1>
        <a href="/index.html" class="px-3 py-1 bg-blue-500 text-white text-sm rounded hover:bg-blue-600">Back to Chat</a>
    </header>
    <main class="max-w-4xl mx-auto mt-8 px-4 space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <div id="statDocs" class="text-3xl font-bold text-blue-600">0</div>
                <div class="text-sm text-gray-500 mt-1">Documents</div>
            </div>
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <div id="statChunks" class="text-3xl font-bold text-green-600">0</div>
                <div class="text-sm text-gray-500 mt-1">Chunks</div>
            </div>
        </div>
        <section class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Upload Documents</h2>
            <div class="space-y-3">
                <div class="flex items-center gap-3">
                    <input id="fileInput" type="file" class="flex-1 border rounded px-3 py-2 text-sm" accept=".txt,.md,.pdf,.html,.htm" multiple>
                    <button id="uploadBtn" class="px-5 py-2 bg-green-500 text-white rounded hover:bg-green-600 text-sm whitespace-nowrap">Upload</button>
                </div>
                <p class="text-xs text-gray-400">Supported: txt, md, pdf, html. Multiple files allowed.</p>
                <div id="uploadProgress" class="hidden">
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="progressBar" class="bg-green-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <p id="uploadMsg" class="mt-1 text-sm text-gray-500"></p>
                </div>
            </div>
        </section>
        <section class="bg-white rounded-lg shadow p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-800">Documents</h2>
                <button id="batchDeleteBtn" class="hidden px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600">Delete Selected</button>
            </div>
            <div id="docList" class="space-y-2">
                <p class="text-gray-400 text-sm">Loading...</p>
            </div>
        </section>
    </main>
    <script src="/js/admin-app.js"></script>
</body>
</html>
