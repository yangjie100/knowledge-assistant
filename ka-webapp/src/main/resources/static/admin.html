<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow px-6 py-3 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-800">Knowledge Base Admin</h1>
        <a href="/index.html" class="px-3 py-1 bg-blue-500 text-white text-sm rounded hover:bg-blue-600">Back to Chat</a>
    </header>

    <main class="max-w-3xl mx-auto mt-8 px-4 space-y-8">
        <!-- Upload Section -->
        <section class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Upload Document</h2>
            <div class="flex items-center gap-3">
                <input id="fileInput" type="file" class="flex-1 border rounded px-3 py-2 text-sm" accept=".txt,.md,.pdf,.html,.htm">
                <button id="uploadBtn" class="px-5 py-2 bg-green-500 text-white rounded hover:bg-green-600 text-sm">Upload</button>
            </div>
            <p id="uploadMsg" class="mt-2 text-sm text-gray-500"></p>
        </section>

        <!-- Document List Section -->
        <section class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Documents</h2>
            <div id="docList" class="space-y-3">
                <p class="text-gray-400 text-sm">Loading...</p>
            </div>
        </section>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadMsg = document.getElementById('uploadMsg');
        const docList = document.getElementById('docList');

        uploadBtn.addEventListener('click', async function() {
            const file = fileInput.files[0];
            if (!file) {
                uploadMsg.textContent = 'Please select a file.';
                uploadMsg.className = 'mt-2 text-sm text-red-500';
                return;
            }
            const formData = new FormData();
            formData.append('file', file);

            try {
                uploadBtn.disabled = true;
                uploadMsg.textContent = 'Uploading...';
                uploadMsg.className = 'mt-2 text-sm text-gray-500';

                const res = await fetch('/api/knowledge/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    uploadMsg.textContent = 'Upload successful!';
                    uploadMsg.className = 'mt-2 text-sm text-green-500';
                    fileInput.value = '';
                    loadDocuments();
                } else {
                    uploadMsg.textContent = 'Upload failed: ' + (data.message || 'Unknown error');
                    uploadMsg.className = 'mt-2 text-sm text-red-500';
                }
            } catch (err) {
                uploadMsg.textContent = 'Network error: ' + err.message;
                uploadMsg.className = 'mt-2 text-sm text-red-500';
            } finally {
                uploadBtn.disabled = false;
            }
        });

        async function loadDocuments() {
            try {
                const res = await fetch('/api/knowledge/list');
                const data = await res.json();
                if (data.success && data.data) {
                    renderDocuments(data.data);
                } else {
                    docList.innerHTML = '<p class="text-gray-400 text-sm">Failed to load documents.</p>';
                }
            } catch (err) {
                docList.innerHTML = '<p class="text-red-400 text-sm">Error: ' + err.message + '</p>';
            }
        }

        function renderDocuments(docs) {
            if (!docs || docs.length === 0) {
                docList.innerHTML = '<p class="text-gray-400 text-sm">No documents yet.</p>';
                return;
            }
            docList.innerHTML = docs.map(function(doc) {
                return '<div class="flex items-center justify-between border rounded px-4 py-3">' +
                    '<div>' +
                    '<span class="font-medium text-gray-800">' + escapeHtml(doc.title || doc.id) + '</span>' +
                    '<span class="ml-2 text-xs text-gray-400">' + escapeHtml(doc.sourceType || '') + '</span>' +
                    '<span class="ml-2 text-xs text-gray-400">' + (doc.chunkCount || 0) + ' chunks</span>' +
                    '</div>' +
                    '<button onclick="deleteDoc(\'' + doc.id + '\')" class="px-3 py-1 bg-red-500 text-white text-xs rounded hover:bg-red-600">Delete</button>' +
                    '</div>';
            }).join('');
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function deleteDoc(id) {
            if (!confirm('Delete this document?')) return;
            try {
                const res = await fetch('/api/knowledge/' + id, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    loadDocuments();
                } else {
                    alert('Delete failed: ' + (data.message || 'Unknown error'));
                }
            } catch (err) {
                alert('Network error: ' + err.message);
            }
        }

        loadDocuments();
    </script>
</body>
</html>
