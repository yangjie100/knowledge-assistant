<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow px-6 py-3 flex items-center justify-between shrink-0">
        <h1 class="text-xl font-bold text-gray-800">Knowledge Assistant</h1>
        <div class="flex items-center gap-4">
            <span id="convId" class="text-sm text-gray-500">Conversation: --</span>
            <button id="newChatBtn" class="px-3 py-1 bg-blue-500 text-white text-sm rounded hover:bg-blue-600">New Chat</button>
            <a href="/admin.html" class="px-3 py-1 bg-gray-200 text-gray-700 text-sm rounded hover:bg-gray-300">Admin</a>
        </div>
    </header>

    <!-- Message Area -->
    <div id="messages" class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
    </div>

    <!-- Input Form -->
    <form id="chatForm" class="bg-white shadow px-6 py-4 flex gap-3 shrink-0">
        <input id="questionInput" type="text" placeholder="Ask a question..." class="flex-1 border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>
        <button type="button" id="streamToggle" class="px-3 py-2 bg-green-500 text-white text-sm rounded hover:bg-green-600">Stream: ON</button>
        <button type="submit" id="sendBtn" class="px-6 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">Send</button>
    </form>

    <script src="/js/chat-app.js"></script>
</body>
</html>
