<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ── Terminal-Lab Dark · DESIGN.md v1.0 ── */
        :root {
            /* Surfaces */
            --ka-canvas:    #0A0E14;
            --ka-surface:   #11161E;
            --ka-surface-2: #161B22;
            --ka-sunken:    #0D1117;
            /* Borders */
            --ka-border:        #21262D;
            --ka-border-strong: #30363D;
            /* Text */
            --ka-text:        #C9D1D9;
            --ka-text-muted:  #8B949E;
            --ka-text-faint:  #6E7681;
            --ka-text-bright: #F0F6FC;
            /* Accents */
            --ka-accent: #7EE787;
            --ka-info:   #58A6FF;
            --ka-tool:   #D2A8FF;
            --ka-think:  #F0883E;
            --ka-danger: #FF7B72;
            /* Type */
            --ka-font-sans: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
            --ka-font-mono: "JetBrains Mono", "Noto Sans Mono CJK SC", ui-monospace, monospace;
        }
        html { color-scheme: dark; }
        body {
            background: var(--ka-canvas);
            color: var(--ka-text);
            font-family: var(--ka-font-sans);
            font-size: 15px;
            line-height: 1.7;
        }
        /* 实验台网格纹理 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(201,209,217,.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,209,217,.02) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
        }
        body > * { position: relative; z-index: 1; }

        /* ── Header ── */
        header {
            background: var(--ka-surface);
            border-bottom: 1px solid var(--ka-border);
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -2px;
            height: 1px;
            background: var(--ka-accent);
            opacity: .6;
            pointer-events: none;
        }
        .ka-logo { color: var(--ka-text-bright); font-size: 20px; font-weight: 600; line-height: 1.4; }
        .ka-logo .ka-logo-mark {
            font-family: var(--ka-font-mono);
            color: var(--ka-accent);
            font-weight: 500;
            margin-right: 8px;
        }
        #convId {
            font-family: var(--ka-font-mono);
            font-size: 12px;
            color: var(--ka-text-muted);
        }

        /* ── Ghost 按钮 ── */
        .ka-ghost-btn {
            font-family: var(--ka-font-mono);
            font-size: 12px;
            letter-spacing: .04em;
            color: var(--ka-text-muted);
            background: transparent;
            border: 1px solid var(--ka-border);
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
            transition: color .15s, border-color .15s;
            display: inline-flex;
            align-items: center;
        }
        .ka-ghost-btn:hover { color: var(--ka-text-bright); border-color: var(--ka-border-strong); }

        /* ── Sidebar ── */
        #conversationSidebar {
            background: var(--ka-surface);
            border-right: 1px solid var(--ka-border);
        }
        #conversationSidebar h2 { color: var(--ka-text-bright); font-size: 16px; font-weight: 600; }
        #closeSidebarBtn { color: var(--ka-text-faint); font-size: 20px; line-height: 1; }
        #closeSidebarBtn:hover { color: var(--ka-text-muted); }
        .conv-item-wrapper {
            border-left: 2px solid transparent;
            border-radius: 4px;
            transition: background .15s, border-color .15s;
        }
        .conv-item-wrapper:hover { background: var(--ka-surface-2); }
        .conv-item-wrapper.ka-active {
            background: var(--ka-surface-2);
            border-left-color: var(--ka-accent);
        }
        .conv-title { color: var(--ka-text); font-size: 13px; line-height: 1.6; }
        .conv-meta {
            font-family: var(--ka-font-mono);
            font-size: 11px;
            color: var(--ka-text-muted);
            letter-spacing: .02em;
        }
        .conv-del { color: var(--ka-text-faint); font-size: 14px; }
        .conv-del:hover { color: var(--ka-danger); }

        /* ── Messages · 实验日志区 ── */
        #messages { scrollbar-width: thin; scrollbar-color: var(--ka-border-strong) transparent; }
        #messages::-webkit-scrollbar { width: 8px; }
        #messages::-webkit-scrollbar-thumb { background: var(--ka-border-strong); border-radius: 4px; }
        /* 空状态 */
        .ka-empty {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
        }
        .ka-empty-mark {
            font-family: var(--ka-font-mono);
            font-size: 28px;
            font-weight: 600;
            color: var(--ka-accent);
            line-height: 1.3;
            animation: ka-blink 1.1s steps(1) infinite;
        }
        .ka-empty-sub { color: var(--ka-text-muted); font-size: 15px; }
        /* 检索中扫描线 */
        #messages.is-loading::after {
            content: '';
            display: block;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--ka-accent), transparent);
            background-size: 50% 100%;
            background-repeat: no-repeat;
            animation: ka-scan 2s linear infinite;
        }
        @keyframes ka-scan {
            0%   { background-position: -50% 0; }
            100% { background-position: 150% 0; }
        }
        @keyframes ka-blink {
            0%, 49%  { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* user 消息：右对齐输入回显 */
        .ka-msg-user {
            align-self: flex-end;
            max-width: 75%;
            background: var(--ka-surface-2);
            border: 1px solid var(--ka-border-strong);
            border-radius: 4px;
            padding: 8px 12px;
            margin: 8px 0 8px auto;
        }
        .ka-msg-user .ka-prefix {
            font-family: var(--ka-font-mono);
            font-size: 11px;
            color: var(--ka-text-muted);
            display: block;
            margin-bottom: 2px;
        }
        .ka-msg-user .ka-body { color: var(--ka-text); }

        /* assistant 消息：全宽日志条目 */
        .ka-msg-ka {
            width: 100%;
            margin: 16px 0;
        }
        .ka-msg-ka .ka-prefix {
            font-family: var(--ka-font-mono);
            font-size: 12px;
            color: var(--ka-accent);
            display: block;
            margin-bottom: 4px;
        }
        .ka-msg-ka .ka-body { color: var(--ka-text); }
        /* 元数据栏 */
        .ka-meta {
            font-family: var(--ka-font-mono);
            font-size: 11px;
            color: var(--ka-text-faint);
            letter-spacing: .04em;
            margin-top: 8px;
            border-top: 1px solid var(--ka-border);
            padding-top: 4px;
        }
        .ka-meta .ka-meta-sep { margin: 0 6px; color: var(--ka-border-strong); }
        /* SSE 流式光标 */
        .ka-cursor {
            display: inline-block;
            color: var(--ka-accent);
            animation: ka-blink 1.1s steps(1) infinite;
            font-family: var(--ka-font-mono);
        }

        /* think 块：琥珀折叠 */
        .think-block {
            border-left: 2px solid var(--ka-think);
            margin: 0 0 12px;
            border-radius: 0 4px 4px 0;
        }
        .think-block summary {
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            font-family: var(--ka-font-mono);
            font-size: 11px;
            letter-spacing: .06em;
            color: var(--ka-think);
            user-select: none;
        }
        .think-block summary::-webkit-details-marker { display: none; }
        .think-block summary:hover { background: rgba(240,136,62,.06); }
        .think-block[open] summary svg { transform: rotate(90deg); }
        .think-block summary svg { transition: transform .2s; flex-shrink: 0; }
        .think-body {
            background: var(--ka-sunken);
            border-radius: 0 4px 4px 0;
            padding: 8px 12px;
            margin-top: 2px;
            font-family: var(--ka-font-mono);
            font-size: 12px;
            color: var(--ka-text-muted);
            white-space: pre-wrap;
            line-height: 1.5;
            max-height: 320px;
            overflow-y: auto;
        }

        /* ── Markdown 正文 ── */
        .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin: .6em 0 .3em; font-weight: 600; color: var(--ka-text-bright); }
        .markdown-content pre {
            background: var(--ka-sunken);
            border: 1px solid var(--ka-border);
            border-radius: 4px;
            padding: 12px;
            overflow-x: auto;
            margin: .6em 0;
            font-family: var(--ka-font-mono);
            font-size: 13px;
            line-height: 1.5;
        }
        .markdown-content pre code { background: none; padding: 0; font-size: inherit; }
        .markdown-content code {
            background: var(--ka-sunken);
            border: 1px solid var(--ka-border);
            padding: 1px 5px;
            border-radius: 3px;
            font-family: var(--ka-font-mono);
            font-size: .88em;
            color: var(--ka-text-bright);
        }
        .markdown-content ul, .markdown-content ol { padding-left: 1.5em; margin: .4em 0; }
        .markdown-content li { margin: .15em 0; }
        .markdown-content blockquote {
            border-left: 2px solid var(--ka-border-strong);
            padding-left: 1em;
            color: var(--ka-text-muted);
            margin: .6em 0;
        }
        .markdown-content table { border-collapse: collapse; width: 100%; margin: .6em 0; font-size: 14px; }
        .markdown-content th, .markdown-content td { border: 1px solid var(--ka-border); padding: 6px 12px; }
        .markdown-content th { background: var(--ka-surface-2); color: var(--ka-text-bright); font-weight: 500; }
        .markdown-content a { color: var(--ka-info); text-decoration: none; border-bottom: 1px solid rgba(88,166,255,.3); }
        .markdown-content a:hover { border-bottom-color: var(--ka-info); }
        .markdown-content p { margin: 0 0 .6em; }
        .markdown-content hr { border: 0; border-top: 1px solid var(--ka-border); margin: 1em 0; }
        .markdown-content strong { color: var(--ka-text-bright); }

        /* ── 输入 dock ── */
        #chatForm {
            background: var(--ka-surface);
            border-top: 1px solid var(--ka-border);
        }
        #questionInput {
            flex: 1;
            background: var(--ka-surface);
            border: 1px solid var(--ka-border);
            border-radius: 4px;
            padding: 8px 14px;
            color: var(--ka-text);
            font-family: var(--ka-font-sans);
            font-size: 15px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        #questionInput::placeholder {
            font-family: var(--ka-font-mono);
            font-size: 14px;
            color: var(--ka-text-faint);
        }
        #questionInput:focus {
            border-color: var(--ka-accent);
            box-shadow: 0 0 0 3px rgba(126,231,135,.12);
        }
        #streamToggle.on { color: var(--ka-accent); }
        #streamToggle:not(.on) { color: var(--ka-text-faint); }
        #sendBtn {
            font-family: var(--ka-font-mono);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .08em;
            text-transform: uppercase;
            background: var(--ka-accent);
            color: #0A0E14;
            border: none;
            border-radius: 4px;
            padding: 8px 24px;
            cursor: pointer;
            transition: filter .15s, box-shadow .15s;
        }
        #sendBtn:hover:not(:disabled) { filter: brightness(1.1); box-shadow: 0 0 12px rgba(126,231,135,.25); }
        #sendBtn:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--ka-accent), 0 0 12px rgba(126,231,135,.15); }
        #sendBtn:disabled { opacity: .5; cursor: not-allowed; }

        /* ── Responsive ── */
        @media (max-width: 767px) {
            .ka-msg-user { max-width: 100%; }
            #convId { display: none; }
            .ka-empty-mark { font-size: 22px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .ka-cursor, .ka-empty-mark { animation: none; }
            #messages.is-loading::after { animation: none; background: var(--ka-border-strong); }
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- Header -->
    <header class="px-6 py-3 flex items-center justify-between shrink-0">
        <h1 class="ka-logo"><span class="ka-logo-mark">▌ KA</span>Knowledge Assistant</h1>
        <div class="flex items-center gap-3">
            <span id="convId">conv: --</span>
            <button id="historyBtn" class="ka-ghost-btn">HISTORY</button>
            <a href="/admin.html" class="ka-ghost-btn">ADMIN</a>
            <button id="newChatBtn" class="ka-ghost-btn" style="color: var(--ka-accent); border-color: rgba(126,231,135,.4);">NEW CHAT</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <div id="conversationSidebar" class="hidden w-72 flex flex-col shrink-0">
            <div class="p-4 border-b flex items-center justify-between" style="border-color: var(--ka-border);">
                <h2>Conversations</h2>
                <button id="closeSidebarBtn" aria-label="Close sidebar">&times;</button>
            </div>
            <div id="conversationList" class="flex-1 overflow-y-auto p-2 space-y-1">
            </div>
        </div>

        <!-- Message Area · 实验日志 -->
        <div id="messages" class="flex-1 overflow-y-auto px-6 py-4 flex flex-col" style="max-width: 820px; margin: 0 auto; width: 100%;">
        </div>
    </div>

    <!-- Input Dock -->
    <form id="chatForm" class="px-6 py-4 flex gap-3 shrink-0 items-center">
        <input id="questionInput" type="text" placeholder="▍ ask anything…" autocomplete="off" required>
        <button type="button" id="streamToggle" class="ka-ghost-btn on">STREAM ON</button>
        <button type="submit" id="sendBtn">SEND</button>
    </form>

    <script src="/js/chat-app.js"></script>
</body>
</html>
