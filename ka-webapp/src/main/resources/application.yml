server:
  port: 8080

spring:
  application:
    name: knowledge-assistant
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: deepseek-r1:32b
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      redis:
        initialize-schema: true
        index-name: knowledge_assistant
        prefix: "ka_"
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

ka:
  rag:
    chunk:
      default-size: 800
      min-size: 200
      overlap: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
